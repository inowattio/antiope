services:
  keycloak:
    build:
      context: .
      dockerfile: keycloak.dockerfile
    image: keycloak-kafka
    ports:
      - '8080:8080'
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KAFKA_CLIENT_ID: keycloak
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANTIOPE_CONFIG: 
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM: SCRAM-SHA-512
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="antiope" password="antiope";
    command: start-dev
    depends_on:
      kafka-init:
        condition: service_completed_successfully
  zookeeper:
    image: 'confluentinc/cp-zookeeper:7.2.6'
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOOKEEPER_CLIENT_PORT=2181
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z -v -w5 localhost 2181']
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: 'confluentinc/cp-kafka:7.2.6'
    container_name: kafka
    ports:
      - '9092:9092'
    volumes:
      - ./.kafka/jaas.conf:/etc/kafka/kafka_server_jaas.conf
    environment:
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_BROKER_ID=1
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=5000

      - KAFKA_SUPER_USERS=User:admin

      - ZOOKEEPER_SASL_ENABLED=FALSE

      - KAFKA_LISTENERS=AUTH://:9092
      - KAFKA_ADVERTISED_LISTENERS=AUTH://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=AUTH:SASL_PLAINTEXT

      - KAFKA_INTER_BROKER_LISTENER_NAME=AUTH
      - KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL=SCRAM-SHA-512
      - KAFKA_SASL_ENABLED_MECHANISMS=SCRAM-SHA-512
      - KAFKA_LISTENER_NAME_AUTH_SASL_ENABLED_MECHANISMS=SCRAM-SHA-512
      - KAFKA_OPTS=-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf
      - KAFKA_AUTHORIZER_CLASS_NAME=kafka.security.authorizer.AclAuthorizer
      - KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false

    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z -v -w5 localhost 9092']
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - bash
      - -ec
      - |
        echo "Creating SCRAM admin user..."

        kafka-configs \
          --zookeeper zookeeper:2181 \
          --alter \
          --entity-type users \
          --entity-name admin \
          --add-config 'SCRAM-SHA-512=[password=admin]'

        echo "Kafka SCRAM admin user ready."
        /etc/confluent/docker/run

  kafka2:
    image: 'confluentinc/cp-kafka:7.2.6'
    container_name: kafka2
    ports:
      - '9093:9092'

    volumes:
      - ./.kafka/jaas.conf:/etc/kafka/kafka_server_jaas.conf
    environment:
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_BROKER_ID=2
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka2:9093
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=2
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=5000

      - KAFKA_SUPER_USERS=User:admin

      - ZOOKEEPER_SASL_ENABLED=FALSE

      - KAFKA_LISTENERS=AUTH://:9093
      - KAFKA_ADVERTISED_LISTENERS=AUTH://kafka2:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=AUTH:SASL_PLAINTEXT

      - KAFKA_INTER_BROKER_LISTENER_NAME=AUTH
      - KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL=SCRAM-SHA-512
      - KAFKA_SASL_ENABLED_MECHANISMS=SCRAM-SHA-512
      - KAFKA_LISTENER_NAME_AUTH_SASL_ENABLED_MECHANISMS=SCRAM-SHA-512
      - KAFKA_OPTS=-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf
      - KAFKA_AUTHORIZER_CLASS_NAME=kafka.security.authorizer.AclAuthorizer
      - KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false

    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z -v -w5 localhost 9093']
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - bash
      - -ec
      - |
        echo "Creating SCRAM admin user..."

        kafka-configs \
          --zookeeper zookeeper:2181 \
          --alter \
          --entity-type users \
          --entity-name admin \
          --add-config 'SCRAM-SHA-512=[password=admin]'

        echo "Kafka SCRAM admin user ready."
        /etc/confluent/docker/run

  kafkaui:
    container_name: kafkaui_local
    image: provectuslabs/kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: inowattio.local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-512
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin";
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: inowattio.local
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports:
      - 1234:8080
  kafka-init:
    image: 'confluentinc/cp-kafka:7.2.6'
    container_name: antiope.kafka.init
    user: '0'
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - SCRAM_MECHANISM=SCRAM-SHA-512
      - DEFAULT_PARTITIONS=1
      - DEFAULT_REPLICATION_FACTOR=1
    volumes:
      - ./.kafka/provision:/etc/kafka/provision
    command:
      - bash
      - -ec
      - |
        /etc/kafka/provision/provision.sh
        echo "Done."
